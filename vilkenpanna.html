<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vilken stekpanna passar dig bäst?</title>
<style>
  body {
    font-family: "SF Pro Display", system-ui, sans-serif;
    background: linear-gradient(180deg, #fff 0%, #f2f6ff 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .quiz-container {
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 500px;
    padding: 30px;
    overflow: hidden;
  }
  h1 { text-align: center; margin-bottom: 1rem; }
  .progress-bar {
    background: #e6e9f0;
    border-radius: 10px;
    height: 10px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress {
    background: linear-gradient(90deg, #007aff, #00b4d8);
    height: 100%;
    width: 0%;
    transition: width 0.4s ease;
  }
  .question {
    display: none;
    text-align: center;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .question.active { display: block; }
  .answers button {
    display: block; width: 100%; margin: 8px 0; padding: 12px 18px;
    font-size: 1rem; border: none; border-radius: 8px;
    background: #f2f4f7; cursor: pointer; transition: all 0.2s ease;
  }
  .answers button:hover { background: #007aff; color: white; }
  #result { display: none; text-align: center; animation: fadeIn 0.4s ease; }
  #result h2 { font-size: 1.6rem; margin-bottom: 0.5rem; }
  #result p { font-size: 1.1rem; line-height: 1.4; }
  .sms-btn {
    margin-top: 1.2rem; display: inline-block; background: #34c759;
    color: white; padding: 10px 18px; border-radius: 8px;
    text-decoration: none; font-weight: 600;
  }
  .sms-btn:hover { opacity: 0.9; }
</style>
</head>
<body>

<div class="quiz-container">
  <h1>Vilken stekpanna passar dig?</h1>
  <div class="progress-bar"><div class="progress" id="progress"></div></div>

  <div id="quiz">
    <div class="question active" data-step="1">
      <h2>Hur ofta lagar du mat hemma?</h2>
      <div class="answers">
        <button data-value="hög">Nästan varje dag</button>
        <button data-value="medel">Några gånger i veckan</button>
        <button data-value="låg">Sällan</button>
      </div>
    </div>
    <div class="question" data-step="2">
      <h2>Vill du kunna diska pannan i maskin?</h2>
      <div class="answers">
        <button data-value="ja">Ja</button>
        <button data-value="nej">Nej</button>
      </div>
    </div>
    <div class="question" data-step="3">
      <h2>Gillar du att ta hand om dina köksredskap?</h2>
      <div class="answers">
        <button data-value="ja">Ja, absolut</button>
        <button data-value="nej">Inte direkt</button>
      </div>
    </div>
    <div class="question" data-step="4">
      <h2>Tycker du det gör något om pannan är tung?</h2>
      <div class="answers">
        <button data-value="ja">Nej, det känns stabilt</button>
        <button data-value="nej">Ja, jag föredrar lättare</button>
      </div>
    </div>
    <div class="question" data-step="5">
      <h2>Vill du kunna steka på hög värme?</h2>
      <div class="answers">
        <button data-value="ja">Ja, för perfekt stekyta</button>
        <button data-value="nej">Inte så viktigt</button>
      </div>
    </div>
  </div>

  <div id="result"></div>
</div>

<script>
const questions = document.querySelectorAll('.question');
const progress = document.getElementById('progress');
let currentStep = 0;
let answers = [];

document.querySelectorAll('.answers button').forEach(btn => {
  btn.addEventListener('click', () => {
    answers.push(btn.getAttribute('data-value'));
    nextQuestion();
  });
});

function nextQuestion() {
  questions[currentStep].classList.remove('active');
  currentStep++;
  if (currentStep < questions.length) {
    questions[currentStep].classList.add('active');
    updateProgress();
  } else {
    showResult();
  }
}

function updateProgress() {
  const percent = ((currentStep) / questions.length) * 100;
  progress.style.width = percent + '%';
}

function showResult() {
  progress.style.width = "100%";
  const quiz = document.getElementById('quiz');
  const result = document.getElementById('result');
  quiz.style.display = 'none';
  result.style.display = 'block';

  let belagd = 0, gjut = 0, kol = 0;
  const [frekvens, disk, skotsel, vikt, varme] = answers;

  if (frekvens === "låg") belagd++;
  if (frekvens === "hög") gjut++, kol++;
  if (disk === "ja") belagd++; else gjut++, kol++;
  if (skotsel === "ja") gjut++, kol++; else belagd++;
  if (vikt === "ja") gjut++; else kol++, belagd++;
  if (varme === "ja") gjut++, kol++; else belagd++;

  let title = "", desc = "", emoji = "", smsText = "";

  if (belagd > gjut && belagd > kol) {
    emoji = "🧈";
    title = "Belagd panna (non-stick)";
    desc = "Perfekt för dig som vill ha enkel rengöring och smidig matlagning.";
  } else if (gjut >= kol) {
    emoji = "🔥";
    title = "Gjutjärnspanna";
    desc = "Klassisk, tung och hållbar. Passar dig som älskar rejäl stekyta.";
  } else {
    emoji = "🥩";
    title = "Kolstålspanna";
    desc = "Lättare än gjutjärn, perfekt för hög värme och fin patina.";
  }

  smsText = encodeURIComponent(`${emoji} Jag passar bäst för en ${title}!`);

  result.innerHTML = `
    <h2>${emoji} ${title}</h2>
    <p>${desc}</p>
    <a class="sms-btn" href="sms:&body=${smsText}">📱 Dela via SMS</a>
  `;
}
</script>

</body>
</html>
